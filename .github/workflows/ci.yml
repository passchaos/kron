name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Repository, evidence and docs checks
        run: zig build fmt bench-index hygiene docs links -j1 --summary all
      - name: Unit and integration tests
        run: zig build test -Doptimize=ReleaseSafe -j1 --summary all
      - name: Compile-fail, fuzz, decoder and single-threaded gates
        run: zig build test-compile-fail test-fuzz test-decoder-matrix test-single-threaded -Doptimize=ReleaseSafe -j1 --summary all
      - name: Regex differential and fuzz gates
        run: zig build test-regex-differential test-regex-fuzz test-regex-equivalence -Doptimize=ReleaseSafe -j1 --summary all
      - name: Benchmark and report self-tests
        run: zig build test-regression test-managed-output-report test-cpp-reference-report test-bench test-application-bench test-dispatch test-snapshot test-sampling-bench test-encoding-bench test-capture-bench test-regex-bench -Doptimize=ReleaseSafe -j1 --summary all
      - name: Cross-platform compile checks
        run: zig build check-platforms -j1 --summary all
      - name: Package, platform-host and recovery gates
        run: zig build test-package-distribution test-platform-host test-crash test-async-crash test-recovery-campaign -Doptimize=ReleaseSafe -j1 --summary all
