name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-0.16.0-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-0.16.0-${{ runner.os }}-
      - name: Repository and docs checks
        run: zig build fmt hygiene docs links -j1 --summary all
      - name: Fast unit tests
        run: zig build test-unit -Doptimize=ReleaseSafe -j1 --summary all
      - name: Unit and integration tests
        run: zig build test -Doptimize=ReleaseSafe -j1 --summary all
      - name: Compile-fail, fuzz, decoder and single-threaded gates
        run: zig build test-compile-fail test-fuzz test-decoder-matrix test-single-threaded -Doptimize=ReleaseSafe -j1 --summary all
      - name: Regex differential and fuzz gates
        run: zig build test-regex-differential test-regex-fuzz test-regex-equivalence -Doptimize=ReleaseSafe -j1 --summary all
      - name: Benchmark and report self-tests
        run: zig build test-regression test-managed-output-report test-bench test-application-bench test-dispatch test-snapshot test-sampling-bench test-encoding-bench test-capture-bench test-regex-bench -Doptimize=ReleaseSafe -j1 --summary all
      - name: Cross-platform compile checks
        run: zig build check-platforms -j1 --summary all
      - name: Package, platform-host and recovery gates
        run: zig build test-package-distribution test-package-single-threaded test-platform-host test-crash test-async-crash test-recovery-campaign -Doptimize=ReleaseSafe -j1 --summary all
