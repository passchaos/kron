name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Repository, evidence and docs checks
        run: zig build fmt bench-index hygiene docs links -j1 --summary all
      - name: Unit and integration tests
        run: zig build test -Doptimize=ReleaseSafe -j1 --summary all
      - name: Cross-platform compile checks
        run: zig build check-platforms -j1 --summary all
      - name: Package and recovery gates
        run: zig build test-package-distribution test-crash test-async-crash test-recovery-campaign -Doptimize=ReleaseSafe -j1 --summary all
