[package]
name = "foundation-logging-core"
version = "0.1.0"
edition = "2021"
description = "Shared asynchronous and mmap-backed logging core for Foundation"
license = "Apache-2.0"

[lib]
name = "foundation_logging_core"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
crc32fast = "1"
libc = "0.2"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tracing-appender = "0.2.5"
